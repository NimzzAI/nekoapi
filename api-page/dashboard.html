<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NekoAPI — Dashboard</title>
<link rel="icon" href="/icon.svg" />
<style>
  :root { --bg: #100e1a; --card: #1a1730; --line: #2c2748; --text: #ece9ff; --dim: #948fc2; --accent: #f472b6; --ok: #34d399; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  header { padding: 32px 20px 8px; text-align: center; }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  nav { text-align: center; margin: 8px 0 28px; }
  nav a { color: var(--accent); text-decoration: none; margin: 0 8px; font-size: 14px; }
  main { max-width: 640px; margin: 0 auto; padding: 0 20px 60px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
</style>
</head>
<body>
  <header>
    <h1><span class="dot"></span>NekoAPI status</h1>
  </header>
  <nav>
    <a href="/">Endpoints</a>
    <a href="/security">Security JSON</a>
    <a href="/logs">Logs JSON</a>
  </nav>
  <main>
    <div class="grid">
      <div class="card"><div class="label">Uptime</div><div class="value" id="uptime">—</div></div>
      <div class="card"><div class="label">Requests / min</div><div class="value" id="rpm">—</div></div>
      <div class="card"><div class="label">Total requests</div><div class="value" id="total">—</div></div>
      <div class="card"><div class="label">Error rate</div><div class="value" id="errorRate">—</div></div>
      <div class="card"><div class="label">Avg response</div><div class="value" id="avg">—</div></div>
      <div class="card"><div class="label">In flight</div><div class="value" id="inFlight">—</div></div>
    </div>
  </main>
  <script src="/js/dashboard.js" defer></script>
</body>
</html>
