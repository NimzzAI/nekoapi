<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>%%API_NAME%% | Server Monitor</title>
<meta name="description" content="Status server real-time %%API_NAME%%.">
<link rel="canonical" href="%%SITE_URL%%/stats">
<meta property="og:type" content="website">
<meta property="og:site_name" content="%%API_NAME%%">
<meta property="og:title" content="%%API_NAME%% | Server Monitor">
<meta property="og:url" content="%%SITE_URL%%/stats">
<meta property="og:image" content="%%SITE_URL%%%%OG_IMAGE%%">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="%%FAVICON%%">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stats/stats.css">
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

<nav class="sticky top-0 z-[60] w-full">
<div class="max-w-7xl mx-auto px-5 h-20 flex items-center gap-4 justify-between">
<div class="flex items-center gap-3 shrink-0">
<a href="/" class="clay-icon-btn"><i class="fa-solid fa-arrow-left text-sm"></i></a>
<h1 class="font-semibold text-lg tracking-tight uppercase" style="color:#15171C;font-family:'Fraunces',serif">System Status</h1>
</div>
<a href="/docs" class="clay-link">DOCS</a>
</div>
</nav>

<main class="flex-grow max-w-7xl mx-auto w-full px-5 py-8 grid gap-6 relative z-10">

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="clay-stat-card reveal">
<div class="flex items-center gap-4 mb-4">
<div class="clay-stat-icon" style="--c:#2B5D3F"><i class="fa-solid fa-clock"></i></div>
<div>
<h3 class="text-[11px] font-black uppercase tracking-widest" style="color:#8A8D93">Uptime</h3>
<p id="uptime" class="font-mono font-black text-lg" style="color:#15171C"><span class="inline-block h-5 w-24 clay-shimmer align-middle"></span></p>
</div>
</div>
<div class="w-full h-1.5 rounded-full overflow-hidden" style="background:#E7E9F2"><div class="h-full" style="background:#2B5D3F;width:100%"></div></div>
</div>

<div class="clay-stat-card reveal">
<div class="flex items-center gap-4 mb-4">
<div class="clay-stat-icon" style="--c:#2B3A67"><i class="fa-solid fa-server"></i></div>
<div>
<h3 class="text-[11px] font-black uppercase tracking-widest" style="color:#8A8D93">Platform</h3>
<p id="platform" class="font-mono font-black text-lg" style="color:#15171C"><span class="inline-block h-5 w-28 clay-shimmer align-middle"></span></p>
</div>
</div>
<div class="flex gap-2 text-[10px] font-bold">
<span id="arch" class="px-2 py-1 rounded-lg" style="background:#E7E9F2;color:#2B3A67">--</span>
<span id="node-ver" class="px-2 py-1 rounded-lg" style="background:#E7E9F2;color:#2B3A67">--</span>
</div>
</div>

<div class="clay-stat-card reveal">
<div class="flex items-center gap-4 mb-4">
<div class="clay-stat-icon" style="--c:#7A2E2E"><i class="fa-solid fa-microchip"></i></div>
<div>
<h3 class="text-[11px] font-black uppercase tracking-widest" style="color:#8A8D93">CPU Load</h3>
<p id="cpu-load" class="font-mono font-black text-lg" style="color:#15171C">0%</p>
</div>
</div>
<p id="cpu-model" class="text-[10px] font-mono font-semibold truncate" style="color:#8A8D93">Detecting...</p>
</div>
</div>

<div class="clay-stat-card reveal">
<h2 class="text-base font-black mb-6 flex items-center gap-2" style="color:#15171C"><i class="fa-solid fa-memory" style="color:#2B3A67"></i> MEMORY USAGE</h2>
<div class="mb-3 flex justify-between text-xs font-bold font-mono" style="color:#8A8D93">
<span>USED: <span id="mem-used" style="color:#15171C">0 GB</span></span>
<span>TOTAL: <span id="mem-total" style="color:#15171C">0 GB</span></span>
</div>
<div class="mem-track mb-3">
<div id="ram-bar" class="mem-fill flex items-center justify-end pr-3">
<span id="ram-percent" class="text-[10px] font-black text-white">0%</span>
</div>
</div>
<p class="text-right text-[10px] font-black" style="color:#2B3A67">FREE: <span id="mem-free">0 GB</span></p>
</div>

</main>

<script src="/stats/stats.js"></script>
</body>
</html>
